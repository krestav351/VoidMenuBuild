
name: Build VoidMenu APK

on:
  workflow_dispatch:
  push:
    paths:
      - "VoidMenu-Android-Project.zip"
      - ".github/workflows/build.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK packages
        uses: android-actions/setup-android@v3

      - name: Install SDK components
        run: |
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Unpack project
        run: unzip -q VoidMenu-Android-Project.zip

      - name: Build APK
        run: cd VoidMenu && gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: VoidMenu-APK
          path: VoidMenu/app/build/outputs/apk/debug/app-debug.apk
          
